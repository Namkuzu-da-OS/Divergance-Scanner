<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Scanner - Unusual Options Activity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a3641;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #00d4aa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d4aa;
            animation: pulse 2s infinite;
        }

        .status-dot.paused {
            background: #ffc107;
            animation: none;
        }

        .status-dot.error {
            background: #ff6b6b;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .last-update {
            font-size: 0.85rem;
            color: #8b92a8;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            padding: 8px 16px;
            border: 1px solid #2a3641;
            background: #151821;
            color: #e5e7eb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #1f2937;
            border-color: #00d4aa;
        }

        .control-btn.active {
            background: #00d4aa;
            color: #0a0e1a;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 8px;
            margin-left: 20px;
        }

        .nav-link {
            padding: 8px 14px;
            border: 1px solid #2a3641;
            background: transparent;
            color: #8b92a8;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-link:hover {
            border-color: #00d4aa;
            color: #00d4aa;
        }

        .nav-link.active {
            border-color: #00d4aa;
            color: #00d4aa;
            background: rgba(0, 212, 170, 0.1);
        }

        .nav-link.earnings {
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .nav-link.earnings:hover,
        .nav-link.earnings.active {
            background: rgba(245, 158, 11, 0.1);
        }

        .nav-link.opportunity {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .nav-link.opportunity:hover,
        .nav-link.opportunity.active {
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-link.premarket {
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .nav-link.premarket:hover,
        .nav-link.premarket.active {
            background: rgba(245, 158, 11, 0.1);
        }

        /* Market Context Banner */
        .market-context {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #151821;
            border-radius: 8px;
            border: 1px solid #2a3641;
        }

        .context-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .context-label {
            font-size: 0.75rem;
            color: #8b92a8;
            text-transform: uppercase;
        }

        .context-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .context-value.bullish { color: #00d4aa; }
        .context-value.bearish { color: #ff6b6b; }
        .context-value.neutral { color: #ffc107; }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: #151821;
            border: 1px solid #2a3641;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .summary-card:hover {
            border-color: #00d4aa;
        }

        .summary-card.active {
            border-color: #00d4aa;
            background: #1a2332;
        }

        .summary-card .count {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4aa;
        }

        .summary-card .label {
            font-size: 0.85rem;
            color: #8b92a8;
            margin-top: 5px;
        }

        .summary-card.unusual .count { color: #00d4aa; }
        .summary-card.gaps .count { color: #ffc107; }
        .summary-card.volume .count { color: #3b82f6; }
        .summary-card.iv .count { color: #a855f7; }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #2a3641;
            background: #151821;
            color: #e5e7eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #00d4aa;
        }

        .filter-btn.active {
            background: #00d4aa;
            color: #0a0e1a;
            border-color: #00d4aa;
        }

        /* Symbol Grid */
        .symbols-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 15px;
        }

        .symbol-card {
            background: #151821;
            border: 1px solid #2a3641;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.2s;
        }

        .symbol-card:hover {
            border-color: #00d4aa;
            transform: translateY(-2px);
        }

        .symbol-card.high-conviction {
            border-left: 3px solid #00d4aa;
        }

        .symbol-card.tradeable {
            border-left: 3px solid #ffc107;
        }

        .symbol-card.watch {
            border-left: 3px solid #8b92a8;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .symbol-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .symbol-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .direction-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .direction-badge.bullish {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }

        .direction-badge.bearish {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .direction-badge.neutral {
            background: rgba(139, 146, 168, 0.2);
            color: #8b92a8;
        }

        .price-section {
            text-align: right;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .gap {
            font-size: 0.85rem;
        }

        .gap.positive { color: #00d4aa; }
        .gap.negative { color: #ff6b6b; }

        /* Score Bar */
        .score-section {
            margin-bottom: 12px;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .score-label {
            font-size: 0.85rem;
            color: #8b92a8;
        }

        .score-value {
            font-weight: 600;
        }

        .tier-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tier-badge.high-conviction {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }

        .tier-badge.tradeable {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .tier-badge.watch {
            background: rgba(139, 146, 168, 0.2);
            color: #8b92a8;
        }

        .score-bar {
            height: 6px;
            background: #2a3641;
            border-radius: 3px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .score-fill.high { background: #00d4aa; }
        .score-fill.medium { background: #ffc107; }
        .score-fill.low { background: #8b92a8; }

        /* Unusual Options Section */
        .unusual-section {
            background: #0d1117;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .unusual-header {
            font-size: 0.85rem;
            color: #00d4aa;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .unusual-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
        }

        .metric-label {
            color: #8b92a8;
            font-size: 0.8rem;
        }

        .metric-value {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .metric-value.highlight {
            color: #00d4aa;
        }

        /* Top Strike */
        .top-strike {
            background: #1a2332;
            border-radius: 4px;
            padding: 8px;
            margin-top: 8px;
        }

        .strike-text {
            font-size: 0.85rem;
            color: #ffc107;
        }

        /* Opportunities Tags */
        .opportunities {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .opp-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .opp-tag.unusual_calls {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }

        .opp-tag.unusual_puts {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .opp-tag.unusual_options {
            background: rgba(139, 146, 168, 0.2);
            color: #8b92a8;
        }

        .opp-tag.gap_up {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }

        .opp-tag.gap_down {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .opp-tag.volume_spike {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .opp-tag.iv_high {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        .opp-tag.iv_low {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        /* Signals List */
        .signals {
            font-size: 0.8rem;
            color: #8b92a8;
        }

        .signals li {
            margin-bottom: 3px;
            padding-left: 10px;
            position: relative;
        }

        .signals li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #00d4aa;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b92a8;
        }

        .empty-state h2 {
            margin-bottom: 10px;
            color: #e5e7eb;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #8b92a8;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a3641;
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .symbols-grid {
                grid-template-columns: 1fr;
            }

            .market-context {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center;">
            <h1>
                <span>📊</span>
                OPPORTUNITY SCANNER
            </h1>
            <nav class="nav-links">
                <a href="zone-scanner.html" class="nav-link">ZONES</a>
                <a href="premarket.html" class="nav-link premarket">PRE-MARKET</a>
                <a href="analytics.html" class="nav-link">ANALYTICS</a>
                <a href="earnings-scanner.html" class="nav-link earnings">EARNINGS</a>
                <a href="opportunity-scanner.html" class="nav-link opportunity active">OPPORTUNITY</a>
                <a href="scanner.html" class="nav-link">MARKET</a>
            </nav>
        </div>
        <div class="status-section">
            <div class="status-dot" id="status-dot"></div>
            <span class="last-update" id="last-update">Loading...</span>
            <div class="controls">
                <button class="control-btn" id="pause-btn" onclick="togglePause()">PAUSE</button>
                <button class="control-btn" onclick="manualScan()">SCAN NOW</button>
                <button class="control-btn" onclick="loadData()">REFRESH</button>
            </div>
        </div>
    </div>

    <div class="market-context" id="market-context">
        <div class="context-item">
            <span class="context-label">SPY</span>
            <span class="context-value" id="spy-price">--</span>
        </div>
        <div class="context-item">
            <span class="context-label">Trend</span>
            <span class="context-value" id="spy-trend">--</span>
        </div>
        <div class="context-item">
            <span class="context-label">VIX</span>
            <span class="context-value" id="vix-value">--</span>
        </div>
        <div class="context-item">
            <span class="context-label">Regime</span>
            <span class="context-value" id="vix-regime">--</span>
        </div>
        <div class="context-item">
            <span class="context-label">Symbols</span>
            <span class="context-value" id="symbol-count">--</span>
        </div>
        <div class="context-item">
            <span class="context-label">Next Scan</span>
            <span class="context-value" id="next-scan">--</span>
        </div>
    </div>

    <div class="summary-cards">
        <div class="summary-card unusual active" data-filter="unusual" onclick="setFilter('unusual')">
            <div class="count" id="unusual-count">0</div>
            <div class="label">Unusual Options</div>
        </div>
        <div class="summary-card gaps" data-filter="gaps" onclick="setFilter('gaps')">
            <div class="count" id="gaps-count">0</div>
            <div class="label">Gaps > 2%</div>
        </div>
        <div class="summary-card volume" data-filter="volume" onclick="setFilter('volume')">
            <div class="count" id="volume-count">0</div>
            <div class="label">Volume Spikes</div>
        </div>
        <div class="summary-card iv" data-filter="iv" onclick="setFilter('iv')">
            <div class="count" id="iv-count">0</div>
            <div class="label">IV Extremes</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" data-filter="high_conviction" onclick="setFilter('high_conviction')">HIGH CONVICTION</button>
        <button class="filter-btn" data-filter="tradeable" onclick="setFilter('tradeable')">TRADEABLE</button>
        <button class="filter-btn" data-filter="unusual" onclick="setFilter('unusual')">Unusual Options</button>
        <button class="filter-btn" data-filter="gaps" onclick="setFilter('gaps')">Gaps</button>
        <button class="filter-btn" data-filter="volume" onclick="setFilter('volume')">Volume</button>
        <button class="filter-btn" data-filter="iv" onclick="setFilter('iv')">IV Extremes</button>
    </div>

    <div class="symbols-grid" id="symbols-grid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading opportunities...</p>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentFilter = 'all';
        let scannerStatus = null;

        // Format numbers
        function formatNumber(num, decimals = 2) {
            if (num === null || num === undefined) return '--';
            return num.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function formatPremium(num) {
            if (!num) return '$0';
            const millions = Math.abs(num) / 1000000;
            return `$${millions.toFixed(1)}M`;
        }

        // Load data
        async function loadData() {
            try {
                const response = await fetch('./data/opportunities.json?' + Date.now());
                if (!response.ok) throw new Error('Failed to fetch data');
                currentData = await response.json();
                updateUI();
            } catch (e) {
                console.error('Failed to load data:', e);
                document.getElementById('symbols-grid').innerHTML = `
                    <div class="empty-state">
                        <h2>Unable to load data</h2>
                        <p>Make sure the opportunity scanner is running</p>
                        <p><code>node monitor/opportunity-scanner.js</code></p>
                    </div>
                `;
            }
        }

        // Load scanner status
        async function loadStatus() {
            try {
                const response = await fetch('http://localhost:8083/status');
                if (!response.ok) throw new Error('Scanner not responding');
                scannerStatus = await response.json();
                updateStatusUI();
            } catch (e) {
                console.error('Failed to load status:', e);
                document.getElementById('status-dot').className = 'status-dot error';
            }
        }

        // Update status UI
        function updateStatusUI() {
            if (!scannerStatus) return;

            const dot = document.getElementById('status-dot');
            const pauseBtn = document.getElementById('pause-btn');
            const nextScan = document.getElementById('next-scan');

            if (scannerStatus.status === 'paused') {
                dot.className = 'status-dot paused';
                pauseBtn.textContent = 'RESUME';
                pauseBtn.classList.add('active');
            } else {
                dot.className = 'status-dot';
                pauseBtn.textContent = 'PAUSE';
                pauseBtn.classList.remove('active');
            }

            if (scannerStatus.nextScanIn) {
                const mins = Math.floor(scannerStatus.nextScanIn / 60);
                const secs = scannerStatus.nextScanIn % 60;
                nextScan.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // Toggle pause
        async function togglePause() {
            const endpoint = scannerStatus?.status === 'paused' ? 'resume' : 'pause';
            try {
                await fetch(`http://localhost:8083/${endpoint}`, { method: 'POST' });
                await loadStatus();
            } catch (e) {
                console.error('Failed to toggle pause:', e);
            }
        }

        // Manual scan
        async function manualScan() {
            try {
                await fetch('http://localhost:8083/scan', { method: 'POST' });
                setTimeout(loadData, 3000); // Wait for scan to complete
            } catch (e) {
                console.error('Failed to trigger scan:', e);
            }
        }

        // Check if data is stale (more than 10 minutes old OR from a different day)
        function isDataStale(timestamp) {
            const dataTime = new Date(timestamp);
            const now = new Date();
            const ageMs = now - dataTime;
            const ageMinutes = ageMs / (1000 * 60);

            // Different day = stale
            if (dataTime.toDateString() !== now.toDateString()) {
                return { stale: true, reason: 'old_day', age: Math.floor(ageMs / (1000 * 60 * 60 * 24)) + ' days old' };
            }

            // More than 10 minutes old during market hours = stale
            if (ageMinutes > 10) {
                return { stale: true, reason: 'old_data', age: Math.floor(ageMinutes) + ' minutes old' };
            }

            return { stale: false };
        }

        // Update UI
        function updateUI() {
            if (!currentData) return;

            // Check for stale data
            const timestamp = new Date(currentData.timestamp);
            const staleCheck = isDataStale(currentData.timestamp);

            // Update last update time with full date
            const dateStr = timestamp.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timeStr = timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const updateEl = document.getElementById('last-update');

            if (staleCheck.stale) {
                updateEl.innerHTML = `<span style="color: #ff6b6b;">⚠️ STALE: ${dateStr} ${timeStr} (${staleCheck.age})</span>`;
                document.getElementById('status-dot').className = 'status-dot error';
                showStaleState(staleCheck);
                return; // Don't render stale data
            } else {
                updateEl.textContent = `Updated: ${dateStr} ${timeStr}`;
            }

            // Check if scanner is starting up (no market context yet)
            if (currentData.scannerStatus === 'starting' || !currentData.marketContext) {
                showStartingState();
                return;
            }

            // Update market context
            const ctx = currentData.marketContext;
            if (ctx) {
                document.getElementById('spy-price').textContent = `$${formatNumber(ctx.spyPrice)}`;
                const spyTrend = document.getElementById('spy-trend');
                spyTrend.textContent = ctx.spyTrend?.toUpperCase() || '--';
                spyTrend.className = `context-value ${ctx.spyTrend}`;

                document.getElementById('vix-value').textContent = formatNumber(ctx.vix, 1);
                document.getElementById('vix-regime').textContent = ctx.vixRegime?.toUpperCase() || '--';
            }

            document.getElementById('symbol-count').textContent = currentData.symbolsScanned || '--';

            // Update summary counts
            const results = currentData.results || [];

            const unusualCount = results.filter(r =>
                r.opportunities.some(o => o.includes('unusual'))
            ).length;
            const gapsCount = results.filter(r =>
                r.opportunities.some(o => o.includes('gap'))
            ).length;
            const volumeCount = results.filter(r =>
                r.opportunities.includes('volume_spike')
            ).length;
            const ivCount = results.filter(r =>
                r.opportunities.some(o => o.includes('iv_'))
            ).length;

            document.getElementById('unusual-count').textContent = unusualCount;
            document.getElementById('gaps-count').textContent = gapsCount;
            document.getElementById('volume-count').textContent = volumeCount;
            document.getElementById('iv-count').textContent = ivCount;

            // Render symbols
            renderSymbols();
        }

        // Show starting state (scanner just started, no data yet)
        function showStartingState() {
            // Clear market context
            document.getElementById('spy-price').textContent = '--';
            document.getElementById('spy-trend').textContent = '--';
            document.getElementById('spy-trend').className = 'context-value';
            document.getElementById('vix-value').textContent = '--';
            document.getElementById('vix-regime').textContent = '--';
            document.getElementById('symbol-count').textContent = '--';

            // Clear summary counts
            document.getElementById('unusual-count').textContent = '0';
            document.getElementById('gaps-count').textContent = '0';
            document.getElementById('volume-count').textContent = '0';
            document.getElementById('iv-count').textContent = '0';

            const grid = document.getElementById('symbols-grid');
            const isWeekend = [0, 6].includes(new Date().getDay());
            const hour = new Date().getHours();
            const isMarketHours = hour >= 5 && hour < 13; // 5am-1pm PST

            let message, subtext;
            if (isWeekend) {
                message = '📅 Market Closed (Weekend)';
                subtext = 'Scanner will start when market opens Monday';
            } else if (!isMarketHours) {
                message = '🌙 Market Closed';
                subtext = 'Scanner will start at market open (8am EST)';
            } else {
                message = '⏳ Scanner Starting...';
                subtext = currentData.message || 'Waiting for first scan to complete';
            }

            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                    <h2 style="font-size: 24px; margin-bottom: 12px; color: #8b92a8;">${message}</h2>
                    <p style="color: #64748b; font-size: 14px;">${subtext}</p>
                </div>
            `;
        }

        // Show stale data state
        function showStaleState(staleCheck) {
            // Clear market context
            document.getElementById('spy-price').textContent = '--';
            document.getElementById('spy-trend').textContent = '--';
            document.getElementById('spy-trend').className = 'context-value';
            document.getElementById('vix-value').textContent = '--';
            document.getElementById('vix-regime').textContent = '--';
            document.getElementById('symbol-count').textContent = '--';

            // Clear summary counts
            document.getElementById('unusual-count').textContent = '0';
            document.getElementById('gaps-count').textContent = '0';
            document.getElementById('volume-count').textContent = '0';
            document.getElementById('iv-count').textContent = '0';

            // Show appropriate message
            const grid = document.getElementById('symbols-grid');
            const isWeekend = [0, 6].includes(new Date().getDay());
            const hour = new Date().getHours();
            const isMarketHours = hour >= 5 && hour < 13; // 5am-1pm PST

            let message, subtext;
            if (staleCheck.reason === 'old_day') {
                if (isWeekend) {
                    message = '📅 Market Closed (Weekend)';
                    subtext = 'Data will refresh when market opens Monday';
                } else if (!isMarketHours) {
                    message = '🌙 Market Closed';
                    subtext = 'Data will refresh at market open (8am EST)';
                } else {
                    message = '⏳ Waiting for Fresh Data';
                    subtext = 'Scanner is starting up...';
                }
            } else {
                message = '⚠️ Data is Stale';
                subtext = `Last scan was ${staleCheck.age}. Click SCAN NOW to refresh.`;
            }

            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                    <h2 style="font-size: 24px; margin-bottom: 12px; color: #8b92a8;">${message}</h2>
                    <p style="color: #64748b; font-size: 14px;">${subtext}</p>
                </div>
            `;
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });

            // Update summary cards
            document.querySelectorAll('.summary-card').forEach(card => {
                card.classList.toggle('active', card.dataset.filter === filter);
            });

            renderSymbols();
        }

        // Filter results
        function filterResults(results) {
            if (currentFilter === 'all') return results;
            if (currentFilter === 'high_conviction') return results.filter(r => r.tier === 'HIGH_CONVICTION');
            if (currentFilter === 'tradeable') return results.filter(r => r.tier === 'TRADEABLE');
            if (currentFilter === 'unusual') return results.filter(r => r.opportunities.some(o => o.includes('unusual')));
            if (currentFilter === 'gaps') return results.filter(r => r.opportunities.some(o => o.includes('gap')));
            if (currentFilter === 'volume') return results.filter(r => r.opportunities.includes('volume_spike'));
            if (currentFilter === 'iv') return results.filter(r => r.opportunities.some(o => o.includes('iv_')));
            return results;
        }

        // Render symbols
        function renderSymbols() {
            const grid = document.getElementById('symbols-grid');
            if (!currentData || !currentData.results) {
                grid.innerHTML = '<div class="empty-state"><h2>No data available</h2></div>';
                return;
            }

            const filtered = filterResults(currentData.results);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No opportunities found</h2>
                        <p>Try changing the filter or wait for the next scan</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(renderSymbolCard).join('');
        }

        // Render symbol card
        function renderSymbolCard(data) {
            const tierClass = data.tier.toLowerCase().replace('_', '-');
            const directionClass = data.direction;

            // Score bar color
            let scoreClass = 'low';
            if (data.score >= 70) scoreClass = 'high';
            else if (data.score >= 50) scoreClass = 'medium';

            // Gap display
            const gap = data.technicals?.gap || 0;
            const gapClass = gap >= 0 ? 'positive' : 'negative';
            const gapText = gap !== 0 ? `${gap >= 0 ? '+' : ''}${gap.toFixed(2)}%` : '';

            // Top strike
            const topStrike = data.unusual?.topStrikes?.[0];
            const topStrikeHtml = topStrike ? `
                <div class="top-strike">
                    <span class="strike-text">
                        Top: ${topStrike.strike}${topStrike.type === 'call' ? 'C' : 'P'}
                        vol/OI ${topStrike.volOiRatio?.toFixed(1) || '?'}x
                        | Premium: ${formatPremium(topStrike.premium)}
                    </span>
                </div>
            ` : '';

            // Premium direction
            const netPremium = data.unusual?.netPremium || 0;
            const premiumDir = netPremium > 0 ? 'BULLISH' : netPremium < 0 ? 'BEARISH' : '';

            return `
                <div class="symbol-card ${tierClass}">
                    <div class="card-header">
                        <div class="symbol-info">
                            <span class="symbol-name">${data.symbol}</span>
                            <span class="direction-badge ${directionClass}">${data.direction.toUpperCase()}</span>
                        </div>
                        <div class="price-section">
                            <div class="price">$${formatNumber(data.price)}</div>
                            ${gapText ? `<div class="gap ${gapClass}">${gapText}</div>` : ''}
                        </div>
                    </div>

                    <div class="score-section">
                        <div class="score-header">
                            <span class="score-label">Score: <span class="score-value">${data.score}/100</span></span>
                            <span class="tier-badge ${tierClass}">${data.tier.replace('_', ' ')}</span>
                        </div>
                        <div class="score-bar">
                            <div class="score-fill ${scoreClass}" style="width: ${data.score}%"></div>
                        </div>
                    </div>

                    <div class="opportunities">
                        ${data.opportunities.map(opp => `
                            <span class="opp-tag ${opp}">${opp.replace('_', ' ').toUpperCase()}</span>
                        `).join('')}
                    </div>

                    <div class="unusual-section">
                        <div class="unusual-header">OPTIONS FLOW</div>
                        <div class="unusual-metrics">
                            <div class="metric">
                                <span class="metric-label">Call Vol</span>
                                <span class="metric-value">${(data.unusual?.callVolume || 0).toLocaleString()}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Put Vol</span>
                                <span class="metric-value">${(data.unusual?.putVolume || 0).toLocaleString()}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">C/P Ratio</span>
                                <span class="metric-value ${data.unusual?.callPutRatio > 2 ? 'highlight' : ''}">${formatNumber(data.unusual?.callPutRatio, 2)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Net Premium</span>
                                <span class="metric-value">${formatPremium(data.unusual?.netPremium)} ${premiumDir}</span>
                            </div>
                        </div>
                        ${topStrikeHtml}
                    </div>

                    <div class="unusual-metrics" style="margin-bottom: 12px;">
                        <div class="metric">
                            <span class="metric-label">Volume</span>
                            <span class="metric-value">${formatNumber(data.technicals?.volumeRatio, 1)}x avg</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">IV Rank</span>
                            <span class="metric-value">${data.technicals?.ivRank ? formatNumber(data.technicals.ivRank, 0) + '%' : '--'}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">RSI</span>
                            <span class="metric-value">${data.technicals?.rsi ? formatNumber(data.technicals.rsi, 0) : '--'}</span>
                        </div>
                    </div>

                    <ul class="signals">
                        ${data.signals.slice(0, 4).map(s => `<li>${s}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        // Initial load
        loadData();
        loadStatus();

        // Auto-refresh
        setInterval(loadData, 30000);
        setInterval(loadStatus, 5000);
    </script>
</body>
</html>
